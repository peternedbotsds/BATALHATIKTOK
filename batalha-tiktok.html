<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalha de Presentes - TikTok LIVE</title>
<style>
  /* ============================================================
     ESTILO - cores e tamanhos ficam nas variáveis abaixo
     ============================================================ */
  :root{
    --a:#ff2d46;  --a2:#a8001a;      /* Lado A (vermelho) */
    --b:#2fe34f;  --b2:#08902a;      /* Lado B (verde) */
    --ouro:#ffd23f; --ouro2:#ff9f1c; /* destaques dourados */
    --fonte:"Arial Black","Segoe UI Black","Impact",system-ui,sans-serif;

    /* tamanhos do modo vertical (1080 x 1920) */
    --fs-meta:62px;  --fs-placar:150px; --fs-nome:68px;
    --fs-num:210px;  --fs-sub:50px;     --fs-pres:20px;
    --fs-vit:84px;   --fs-fim:42px;     --barra-w:100px; --ic:110px;
    --fs-doador:30px; --av:78px;
  }
  #stage.horizontal{
    --fs-meta:46px;  --fs-placar:104px; --fs-nome:52px;
    --fs-num:150px;  --fs-sub:40px;     --fs-pres:16px;
    --fs-vit:124px;  --fs-fim:54px;     --barra-w:90px; --ic:76px;
    --fs-doador:26px; --av:64px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    font-family:var(--fonte);
    color:#fff;
    background:
      radial-gradient(ellipse at 50% 0%, #5a3bd1 0%, transparent 60%),
      linear-gradient(180deg, #14105a 0%, #2b1a86 55%, #43238f 100%);
  }
  body.transparente{ background:transparent; }

  /* palco com tamanho fixo, escalado para caber na janela */
  #stage{
    position:absolute; left:50%; top:50%;
    transform-origin:center center;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ---------- topo: meta + placar geral ---------- */
  #topo{
    display:flex; flex-direction:column; align-items:center;
    gap:6px; padding-top:30px; flex:none;
  }
  #meta{
    font-size:var(--fs-meta);
    padding:6px 44px 8px;
    border-radius:80px;
    background:linear-gradient(180deg, var(--ouro), var(--ouro2));
    color:#4a2300;
    border:6px solid #fff;
    box-shadow:0 8px 0 rgba(0,0,0,.35);
    letter-spacing:1px;
  }
  #placar{
    display:flex; align-items:center; gap:34px;
    font-size:var(--fs-placar); line-height:1;
    -webkit-text-stroke:10px rgba(0,0,0,.55);
    paint-order:stroke fill;
  }
  #placar .pa{ color:var(--a); text-shadow:0 0 34px rgba(255,45,70,.8); }
  #placar .pb{ color:var(--b); text-shadow:0 0 34px rgba(47,227,79,.8); }
  #placar .x{ font-size:.5em; color:#fff; }
  #placar span{ display:inline-block; }
  #placar .sobe{ animation:sobe .5s ease-out; }
  @keyframes sobe{ 0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)} }

  /* ---------- os dois lados ---------- */
  #lados{ flex:1; display:flex; min-height:0; }
  .lado{
    position:relative; flex:1; min-width:0;
    display:flex; flex-direction:column;
    padding:0 18px 12px;
  }
  .lado.A{ background:linear-gradient(180deg, rgba(255,45,70,.22), rgba(255,45,70,.04)); }
  .lado.B{ background:linear-gradient(180deg, rgba(47,227,79,.20), rgba(47,227,79,.04)); border-left:6px solid rgba(255,255,255,.35); }

  .nome{
    flex:none; text-align:center;
    font-size:var(--fs-nome);
    height:calc(var(--fs-nome) * 1.1 + 24px);      /* altura fixa: os dois lados ficam alinhados */
    line-height:calc(var(--fs-nome) * 1.1);
    padding:10px 0 14px;
    -webkit-text-stroke:.13em rgba(0,0,0,.55);
    paint-order:stroke fill;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .A .nome{ color:#ff8f9c; }
  .B .nome{ color:#9dffaf; }

  .corpo{ flex:1; display:flex; gap:16px; min-height:0; }
  .B .corpo{ flex-direction:row-reverse; }

  /* barra vertical */
  .barra-wrap{ position:relative; width:var(--barra-w); flex:none; }
  .barra{
    position:absolute; inset:0;
    border-radius:70px;
    border:7px solid #fff;
    background:rgba(0,0,0,.45);
    overflow:hidden;
    box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 30px rgba(0,0,0,.5);
  }
  .barra.tremer{ animation:tremer .32s linear; }
  @keyframes tremer{
    0%,100%{ transform:translate(0,0) } 20%{ transform:translate(-5px,2px) }
    40%{ transform:translate(5px,-3px) } 60%{ transform:translate(-4px,-2px) }
    80%{ transform:translate(4px,3px) }
  }
  .enchimento{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    transition:height .6s cubic-bezier(.2,.9,.25,1);
  }
  .A .enchimento{
    background:
      linear-gradient(135deg, rgba(255,255,255,.25) 25%, transparent 25% 50%, rgba(255,255,255,.25) 50% 75%, transparent 75%) 0 0/48px 48px,
      linear-gradient(0deg, var(--a2), var(--a));
    box-shadow:0 0 40px var(--a);
  }
  .B .enchimento{
    background:
      linear-gradient(135deg, rgba(255,255,255,.25) 25%, transparent 25% 50%, rgba(255,255,255,.25) 50% 75%, transparent 75%) 0 0/48px 48px,
      linear-gradient(0deg, var(--b2), var(--b));
    box-shadow:0 0 40px var(--b);
  }
  .enchimento{ animation:listras 1.2s linear infinite; }
  @keyframes listras{ from{ background-position:0 0, 0 0; } to{ background-position:48px 0, 0 0; } }
  .enchimento::after{ /* brilho no topo da barra */
    content:""; position:absolute; left:0; right:0; top:0; height:10px;
    background:rgba(255,255,255,.85);
  }
  .marcas{ /* uma marca a cada 10% */
    position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent 0, transparent calc(10% - 3px), rgba(255,255,255,.35) calc(10% - 3px), rgba(255,255,255,.35) 10%);
  }

  /* "+1" flutuante */
  .flutuantes{ position:absolute; inset:0; pointer-events:none; z-index:3; }
  .mais{
    position:absolute; left:50%;
    font-size:68px; color:#fff;
    -webkit-text-stroke:10px rgba(0,0,0,.7); paint-order:stroke fill;
    animation:subir 1.1s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes subir{
    0%  { opacity:0; transform:translate(-50%,0) scale(.5); }
    15% { opacity:1; transform:translate(-50%,-20px) scale(1.25); }
    100%{ opacity:0; transform:translate(-50%,-190px) scale(1); }
  }

  /* palco do personagem */
  .palco{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
  .numero{
    flex:none; text-align:center; line-height:.95;
    transition:transform .2s;
  }
  .numero.pulsa{ animation:pulsa .3s ease-out; }
  @keyframes pulsa{ 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .atual{
    display:block; font-size:var(--fs-num);
    -webkit-text-stroke:16px rgba(0,0,0,.55); paint-order:stroke fill;
  }
  .A .atual{ color:var(--a); text-shadow:0 0 50px rgba(255,45,70,.85); }
  .B .atual{ color:var(--b); text-shadow:0 0 50px rgba(47,227,79,.85); }
  .meta-txt{
    display:block; font-size:var(--fs-sub); color:#fff;
    -webkit-text-stroke:8px rgba(0,0,0,.55); paint-order:stroke fill;
  }
  .personagem{
    flex:1; min-height:0; width:100%; margin-top:6px;
    object-fit:cover; object-position:50% 14%;   /* enquadra pelo rosto */
    border-radius:34px;
    border:8px solid #fff;
    box-shadow:0 12px 0 rgba(0,0,0,.35);
  }
  .A .personagem{ border-color:var(--a); }
  .B .personagem{ border-color:var(--b); }

  /* modo horizontal: foto à esquerda, número e presentes à direita */
  .horizontal .palco{ position:relative; padding-left:calc(44% + 18px); }
  .horizontal .personagem{
    position:absolute; left:0; top:0; bottom:0; width:44%; height:100%;
    margin-top:0; object-position:50% 14%;
  }

  /* presentes de cada lado: cartões grandes com a figurinha em destaque */
  .rotulo{
    flex:none; text-align:center; margin-top:12px;
    font-family:"Segoe UI","Arial",sans-serif; font-weight:800;
    font-size:calc(var(--fs-pres) * 1.25); line-height:1.1;
    text-shadow:0 2px 0 rgba(0,0,0,.6);
  }
  .A .rotulo{ color:#ffb3bb; }
  .B .rotulo{ color:#b8ffc5; }
  .presentes{
    flex:none; list-style:none;
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:14px 10px; margin-top:16px;
  }
  .presentes li{
    position:relative;
    width:calc((100% - 20px) / 3);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px;
    padding:8px 4px 8px;
    border-radius:22px;
    background:rgba(0,0,0,.5);
    border:4px solid rgba(255,255,255,.85);
    min-width:0;
  }
  .A .presentes li{ border-color:var(--a); }
  .B .presentes li{ border-color:var(--b); }
  .presentes .ic-img{
    width:var(--ic); height:var(--ic); object-fit:contain;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));
  }
  .presentes .ic{ font-size:calc(var(--ic) * .8); line-height:1; }
  .presentes .tx{
    width:100%; text-align:center;
    font-family:"Segoe UI","Arial",sans-serif; font-weight:800;
    font-size:var(--fs-pres); line-height:1.05;
    overflow-wrap:anywhere;
  }
  .presentes .pt{
    position:absolute; top:-12px; right:-8px;
    font-size:calc(var(--fs-pres) * 1.1); line-height:1;
    padding:3px 9px 4px; border-radius:20px;
    background:linear-gradient(180deg, var(--ouro), var(--ouro2));
    color:#4a2300; border:3px solid #fff;
  }

  /* ---------- vitória ---------- */
  .vitoria{
    position:absolute; inset:0; z-index:6;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.28), rgba(0,0,0,.6) 75%);
    text-align:center;
  }
  .vitoria.ativa{ display:flex; }
  .v1{
    font-size:var(--fs-vit); line-height:1; white-space:nowrap;
    background:linear-gradient(180deg, #fff6b0, var(--ouro) 45%, var(--ouro2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,210,63,.9));
    animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;
  }
  .v2{
    font-size:var(--fs-fim); color:#fff;
    -webkit-text-stroke:8px rgba(0,0,0,.65); paint-order:stroke fill;
    animation:pop .6s .15s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes pop{ 0%{ transform:scale(.2); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .lado.perdeu .barra-wrap, .lado.perdeu .palco{ filter:grayscale(1) brightness(.5); transition:filter .4s; }
  .lado.ganhou{ animation:brilho .6s ease-in-out 3; }
  @keyframes brilho{ 50%{ box-shadow:inset 0 0 120px rgba(255,255,255,.55); } }

  /* ---------- top 3 doadores ---------- */
  #top3{
    flex:none; padding:14px 24px 26px;
    background:linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.25));
    border-top:6px solid rgba(255,255,255,.35);
  }
  #top3 h3{
    text-align:center; font-size:30px; color:var(--ouro);
    -webkit-text-stroke:6px rgba(0,0,0,.6); paint-order:stroke fill;
    margin-bottom:10px;
  }
  #top3lista{ list-style:none; display:flex; gap:16px; justify-content:center; }
  .doador{
    flex:1; min-width:0; max-width:340px;
    display:flex; align-items:center; gap:12px;
    padding:10px 14px;
    border-radius:22px;
    background:rgba(0,0,0,.5);
    border:5px solid rgba(255,255,255,.8);
  }
  .doador.A{ border-color:var(--a); }
  .doador.B{ border-color:var(--b); }
  .doador.vazio{ opacity:.45; border-style:dashed; }
  .medalha{ font-size:42px; line-height:1; flex:none; }
  .avatar{
    flex:none; width:var(--av); height:var(--av); border-radius:50%;
    border:4px solid #fff; object-fit:cover; background:#444;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--av) * .5);
  }
  .info{ min-width:0; flex:1; }
  .dn{ font-size:var(--fs-doador); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15; }
  .dp{ font-size:calc(var(--fs-doador) * .8); color:var(--ouro); line-height:1.15; }

  /* ---------- indicador de conexão ---------- */
  #status{
    position:absolute; top:22px; left:22px; z-index:20;
    width:26px; height:26px; border-radius:50%;
    border:4px solid #fff; background:#e53935;
    box-shadow:0 0 10px rgba(0,0,0,.6);
  }
  #status.on{ background:#2fe34f; }

  #confete{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }

  @media (prefers-reduced-motion:reduce){
    .enchimento{ animation:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="status" title="Desconectado do TikFinity"></div>

  <div id="topo">
    <div id="meta"></div>
    <div id="placar">
      <span class="pa" id="pA">0</span>
      <span class="x">x</span>
      <span class="pb" id="pB">0</span>
    </div>
  </div>

  <div id="lados"></div>

  <div id="top3">
    <h3>Top 3 da rodada</h3>
    <ol id="top3lista"></ol>
  </div>

  <canvas id="confete"></canvas>
</div>

// Foto de cada lado. Deixe vazio ("") para usar a foto que já está embutida neste arquivo,
// ou coloque uma URL / nome de arquivo na mesma pasta (ex: "foto-a.png") para trocar.
const IMAGEM_A = "";
const IMAGEM_B = "";
const MODO = "vertical";                              // "vertical" (1080x1920) ou "horizontal" (1920x1080)
const FUNDO_TRANSPARENTE = false;                     // true = sem fundo (para fonte de navegador)
const SOM_ATIVO = true;                               // som curto na vitória
const GUARDAR_PLACAR = true;                          // lembra o placar geral se a página for recarregada

/* Opções pela URL (úteis sem editar o arquivo):
   ?modo=horizontal   ?transparente=1   ?porta=21213                         */
const params = new URLSearchParams(location.search);
const modoFinal = (params.get("modo") || MODO) === "horizontal" ? "horizontal" : "vertical";
const transparenteFinal = params.get("transparente") === "1" || FUNDO_TRANSPARENTE;
function resolverUrl() {
  if (params.get("porta")) return "ws://127.0.0.1:" + params.get("porta") + "/";
  const origem = params.get("origem") || ORIGEM;
  const abertoPorServidor = location.protocol === "http:" || location.protocol === "https:";
  if (origem === "servidor" || (origem === "auto" && abertoPorServidor)) {
    return (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "127.0.0.1:3000") + "/";
  }
  return TIKFINITY_URL;
}
const urlFinal = resolverUrl();

/* ==================================================================
   ESTADO DO JOGO
   ================================================================== */
const estado  = { A: 0, B: 0 };        // pontos da rodada atual
const placar  = { A: 0, B: 0 };        // rodadas vencidas
let doadores  = new Map();             // top doadores da rodada
let travado   = false;                 // true durante a tela de vitória
let timerVitoria = null;
const pendentes = new Map();           // combos ainda em andamento

/* ==================================================================
   UTILIDADES
   ================================================================== */
const $ = (id) => document.getElementById(id);

// normaliza nomes: minúsculas, sem acento, sem espaços duplicados
const norm = (s) => String(s == null ? "" : s)
  .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\s+/g, " ").trim();

const SET_A = new Set(PRESENTES_A.map(norm));
const SET_B = new Set(PRESENTES_B.map(norm));

function ladoDoPresente(nome) {
  const n = norm(nome);
  if (SET_A.has(n)) return "A";
  if (SET_B.has(n)) return "B";
  return null;
}

// pega o primeiro campo existente de uma lista de nomes possíveis
function pegar(obj, chaves, padrao) {
  for (const c of chaves) {
    if (obj && obj[c] !== undefined && obj[c] !== null && obj[c] !== "") return obj[c];
  }
  return padrao;
}

/* ==================================================================
   MONTAGEM DA TELA
   ================================================================== */
const ui = { A: {}, B: {} };

function montarLado(l, nome, lista, imagem) {
  const sec = document.createElement("section");
  sec.className = "lado " + l;
  sec.innerHTML =
    '<div class="nome"></div>' +
    '<div class="corpo">' +
      '<div class="barra-wrap">' +
        '<div class="barra"><div class="enchimento"></div><div class="marcas"></div></div>' +
        '<div class="flutuantes"></div>' +
      '</div>' +
      '<div class="palco">' +
        '<div class="numero"><span class="atual">0</span><span class="meta-txt"></span></div>' +
        '<img class="personagem" alt="">' +
        '<div class="rotulo"></div>' +
        '<ul class="presentes"></ul>' +
      '</div>' +
    '</div>' +
    '<div class="vitoria"><div class="v1">VITÓRIA!</div><div class="v2">FIM DA RODADA</div></div>';

  sec.querySelector(".nome").textContent = nome;
  sec.querySelector(".meta-txt").textContent = "/ " + META;
  sec.querySelector(".rotulo").textContent = "Presentes que valem +" + PONTOS_POR_PRESENTE;

  const img = sec.querySelector(".personagem");
  const fonte = imagem || FOTOS_LADOS[l];
  if (fonte) {
    // se a imagem personalizada falhar, volta para a foto embutida
    img.onerror = () => { if (FOTOS_LADOS[l] && img.src !== FOTOS_LADOS[l]) img.src = FOTOS_LADOS[l]; };
    img.src = fonte;
  } else {
    img.style.display = "none";
  }

  const ul = sec.querySelector(".presentes");
  lista.forEach((p) => {
    const li = document.createElement("li");
    const src = IMAGENS_PRESENTES[norm(p)];
    let ic;
    if (src) { ic = document.createElement("img"); ic.src = src; ic.alt = ""; ic.className = "ic-img"; }
    else { ic = document.createElement("span"); ic.className = "ic"; ic.textContent = "🎁"; }
    const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = p;
    const pt = document.createElement("span"); pt.className = "pt"; pt.textContent = "+" + PONTOS_POR_PRESENTE;
    li.append(ic, tx, pt);
    ul.appendChild(li);
  });

  $("lados").appendChild(sec);
  ui[l] = {
    sec,
    barra: sec.querySelector(".barra"),
    enchimento: sec.querySelector(".enchimento"),
    flut: sec.querySelector(".flutuantes"),
    numero: sec.querySelector(".numero"),
    atual: sec.querySelector(".atual"),
    vitoria: sec.querySelector(".vitoria")
  };
}

function iniciarTela() {
  const stage = $("stage");
  const W = modoFinal === "horizontal" ? 1920 : 1080;
  const H = modoFinal === "horizontal" ? 1080 : 1920;
  stage.classList.add(modoFinal);
  stage.style.width = W + "px";
  stage.style.height = H + "px";
  stage.W = W; stage.H = H;
  const cv = $("confete"); cv.width = W; cv.height = H;

  if (transparenteFinal) document.body.classList.add("transparente");

  $("meta").textContent = "META: " + META;
  montarLado("A", NOME_A, PRESENTES_A, IMAGEM_A);
  montarLado("B", NOME_B, PRESENTES_B, IMAGEM_B);

  ajustarNome(ui.A.sec.querySelector(".nome"));
  ajustarNome(ui.B.sec.querySelector(".nome"));
  ajustarEscala();
  window.addEventListener("resize", ajustarEscala);
}

// diminui a letra do nome até ele caber no lado (nomes grandes como "FLAVIO BOLSONARO")
function ajustarNome(el) {
  el.style.fontSize = "";
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && fs > 22) {
    fs -= 2;
    el.style.fontSize = fs + "px";
  }
  if (el.style.fontSize) el.style.fontSize = (fs - 3) + "px";   // folga para o contorno da letra
}

function ajustarEscala() {
  const stage = $("stage");
  const s = Math.min(window.innerWidth / stage.W, window.innerHeight / stage.H);
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}

/* ==================================================================
   ATUALIZAÇÃO DA TELA
   ================================================================== */
function render() {
  ["A", "B"].forEach((l) => {
    const pts = Math.min(estado[l], META);
    ui[l].enchimento.style.height = (pts / META * 100) + "%";
    ui[l].atual.textContent = pts;
  });
  $("pA").textContent = placar.A;
  $("pB").textContent = placar.B;
  renderTop3();
}

function criarAvatar(d) {
  const inicial = d ? (Array.from(d.nome)[0] || "?").toUpperCase() : "?";
  const cai = () => {
    const div = document.createElement("div");
    div.className = "avatar"; div.textContent = inicial;
    return div;
  };
  if (d && d.foto) {
    const img = document.createElement("img");
    img.className = "avatar"; img.alt = "";
    img.onerror = () => { img.replaceWith(cai()); };
    img.src = d.foto;
    return img;
  }
  return cai();
}

function renderTop3() {
  const lista = Array.from(doadores.values()).sort((a, b) => b.pontos - a.pontos).slice(0, 3);
  const box = $("top3lista");
  box.textContent = "";
  for (let i = 0; i < 3; i++) {
    const d = lista[i];
    const li = document.createElement("li");
    li.className = "doador" + (d ? " " + d.lado : " vazio");

    const med = document.createElement("span");
    med.className = "medalha"; med.textContent = ["🥇", "🥈", "🥉"][i];

    const info = document.createElement("div"); info.className = "info";
    const n = document.createElement("div"); n.className = "dn"; n.textContent = d ? d.nome : "—";
    const p = document.createElement("div"); p.className = "dp"; p.textContent = d ? d.pontos + " pts" : "aguardando";
    info.append(n, p);

    li.append(med, criarAvatar(d), info);
    box.appendChild(li);
  }
}

function reiniciarAnimacao(el, classe, ms) {
  el.classList.remove(classe);
  void el.offsetWidth;                 // força o navegador a reiniciar a animação
  el.classList.add(classe);
  setTimeout(() => el.classList.remove(classe), ms);
}

function flutuar(l, texto, pct) {
  const f = document.createElement("div");
  f.className = "mais";
  f.textContent = texto;
  f.style.bottom = Math.max(2, Math.min(pct, 90)) + "%";
  f.style.marginLeft = (Math.random() * 30 - 15) + "px";
  ui[l].flut.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

/* ==================================================================
   LÓGICA PRINCIPAL
   ================================================================== */
function adicionar(l, pontos, doador) {
  if (travado || pontos <= 0) return;

  estado[l] += pontos;

  if (doador) {
    const chave = doador.id;
    const atual = doadores.get(chave) || { nome: doador.nome, foto: doador.foto, pontos: 0, lado: l };
    atual.pontos += pontos;
    atual.lado = l;
    if (doador.foto) atual.foto = doador.foto;
    doadores.set(chave, atual);
  }

  render();
  reiniciarAnimacao(ui[l].barra, "tremer", 350);
  reiniciarAnimacao(ui[l].numero, "pulsa", 350);
  flutuar(l, "+" + pontos, Math.min(estado[l], META) / META * 100);

  if (estado[l] >= META) vencer(l);
}

function vencer(l) {
  travado = true;
  placar[l]++;
  salvarPlacar();
  render();
  reiniciarAnimacao($("placar"), "sobe", 600);

  const outro = l === "A" ? "B" : "A";
  ui[l].vitoria.classList.add("ativa");
  ui[l].sec.classList.add("ganhou");
  ui[outro].sec.classList.add("perdeu");

  soltarConfete(l);
  tocarVitoria();

  timerVitoria = setTimeout(novaRodada, DURACAO_VITORIA_MS);
}

function novaRodada() {
  timerVitoria = null;
  estado.A = 0; estado.B = 0;
  doadores = new Map();
  ["A", "B"].forEach((l) => {
    ui[l].vitoria.classList.remove("ativa");
    ui[l].sec.classList.remove("ganhou", "perdeu");
  });
  travado = false;
  render();
}

function resetarTudo() {
  if (timerVitoria) { clearTimeout(timerVitoria); timerVitoria = null; }
  pendentes.forEach((p) => clearTimeout(p.timer));
  pendentes.clear();
  placar.A = 0; placar.B = 0;
  salvarPlacar();
  novaRodada();
}

/* ---------- placar guardado no navegador ---------- */
function salvarPlacar() {
  if (!GUARDAR_PLACAR) return;
  try { localStorage.setItem("batalha_placar", JSON.stringify(placar)); } catch (e) {}
}
function carregarPlacar() {
  if (!GUARDAR_PLACAR) return;
  try {
    const salvo = JSON.parse(localStorage.getItem("batalha_placar") || "null");
    if (salvo) { placar.A = salvo.A | 0; placar.B = salvo.B | 0; }
  } catch (e) {}
}

/* ==================================================================
   PRESENTES RECEBIDOS DO TIKFINITY
   ================================================================== */
function tratarPresente(data) {
  // junta campos aninhados (data.user / data.gift), se existirem
  const d = Object.assign({}, data.user || {}, data.gift || {}, data);

  const nomePresente = pegar(d, ["giftName", "gift_name", "name"], "");
  let qtd = parseInt(pegar(d, ["repeatCount", "count", "amount"], 1), 10);
  if (!qtd || qtd < 1) qtd = 1;

  const usuario = String(pegar(d, ["nickname", "uniqueId", "userId"], "Alguém"));
  const idUsuario = String(pegar(d, ["uniqueId", "userId", "nickname"], usuario));
  const foto = pegar(d, ["profilePictureUrl", "profilePicture", "avatarUrl"], "");

  const lado = ladoDoPresente(nomePresente);
  if (!lado) {
    console.log("[Batalha] presente ignorado (fora das listas A/B):", nomePresente);
    return;
  }

  // repeatEnd pode vir como true/false ou 1/0
  let fim;
  if (d.repeatEnd !== undefined && d.repeatEnd !== null) {
    fim = d.repeatEnd === true || d.repeatEnd === 1 || d.repeatEnd === "true";
  }
  // giftType 1 = presente que aceita sequência (combo)
  const emSequencia = fim === false && d.giftType !== 0;

  const chave = idUsuario + "|" + norm(nomePresente);
  const doador = { id: idUsuario, nome: usuario, foto: foto };

  if (emSequencia) {
    // combo em andamento: guarda o último valor e espera o fim
    const anterior = pendentes.get(chave);
    if (anterior) clearTimeout(anterior.timer);
    const timer = setTimeout(() => {
      pendentes.delete(chave);
      adicionar(lado, qtd * PONTOS_POR_PRESENTE, doador);   // segurança: o aviso de fim não chegou
    }, TEMPO_LIMITE_SEQUENCIA_MS);
    pendentes.set(chave, { timer });
    return;
  }

  // presente simples ou fim do combo: conta na hora
  const p = pendentes.get(chave);
  if (p) { clearTimeout(p.timer); pendentes.delete(chave); }
  adicionar(lado, qtd * PONTOS_POR_PRESENTE, doador);
}

/* ==================================================================
   CONEXÃO WEBSOCKET COM O TIKFINITY
   ================================================================== */
function definirStatus(ligado) {
  const s = $("status");
  s.classList.toggle("on", ligado);
  s.title = ligado ? "Conectado ao TikFinity" : "Desconectado do TikFinity";
}

function conectar() {
  let ws;
  try {
    ws = new WebSocket(urlFinal);
  } catch (e) {
    setTimeout(conectar, RECONECTAR_MS);
    return;
  }
  ws.onopen = () => { definirStatus(true); console.log("[Batalha] conectado ao TikFinity:", urlFinal); };
  ws.onclose = () => { definirStatus(false); setTimeout(conectar, RECONECTAR_MS); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    console.log("[Batalha] evento bruto:", msg);                 // use para conferir os nomes dos campos
    const tipo = String(msg.event || msg.type || "").toLowerCase();
    if (tipo !== "gift") return;
    try { tratarPresente(msg.data || msg); } catch (e) { console.error("[Batalha] erro ao tratar presente:", e); }
  };
}

/* ==================================================================
   EFEITOS: CONFETE E SOM
   ================================================================== */
const confete = [];
let rodandoConfete = false;

function soltarConfete(l) {
  const stage = $("stage");
  const cores = l === "A"
    ? ["#ff2d46", "#ff8f9c", "#ffd23f", "#ffffff"]
    : ["#2fe34f", "#9dffaf", "#ffd23f", "#ffffff"];
  const x0 = stage.W * (l === "A" ? 0.25 : 0.75);
  const y0 = stage.H * 0.4;
  for (let i = 0; i < 160; i++) {
    const ang = Math.random() * Math.PI * 2;
    const vel = 8 + Math.random() * 22;
    confete.push({
      x: x0, y: y0,
      vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel - 10,
      w: 12 + Math.random() * 14, h: 8 + Math.random() * 10,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      cor: cores[(Math.random() * cores.length) | 0],
      vida: 120 + Math.random() * 60
    });
  }
  if (!rodandoConfete) { rodandoConfete = true; requestAnimationFrame(animarConfete); }
}

function animarConfete() {
  const cv = $("confete"), cx = cv.getContext("2d");
  cx.clearRect(0, 0, cv.width, cv.height);
  for (let i = confete.length - 1; i >= 0; i--) {
    const p = confete[i];
    p.vy += 0.5; p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida--;
    if (p.vida <= 0 || p.y > cv.height + 40) { confete.splice(i, 1); continue; }
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.min(1, p.vida / 30);
    cx.fillStyle = p.cor;
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  if (confete.length) requestAnimationFrame(animarConfete);
  else { rodandoConfete = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

let audioCtx = null;
function tocarVitoria() {
  if (!SOM_ATIVO) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + i * 0.12;
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.32);
    });
  } catch (e) { /* som é opcional */ }
}

/* ==================================================================
   MODO TESTE (teclado): A = +1 lado A | B = +1 lado B | R = resetar tudo
   ================================================================== */
const NOMES_TESTE = ["Ana", "Bruno", "Carla", "Diego", "Elisa"];
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "a" || k === "b") {
    const nome = NOMES_TESTE[(Math.random() * NOMES_TESTE.length) | 0];
    adicionar(k.toUpperCase(), PONTOS_POR_PRESENTE, { id: "teste-" + nome, nome: nome, foto: "" });
  } else if (k === "r") {
    resetarTudo();
  }
});

/* ==================================================================
   INÍCIO
   ================================================================== */
carregarPlacar();
iniciarTela();
render();
definirStatus(false);
conectar();
</script>
